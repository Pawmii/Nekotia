# Limine configuration (https://codeberg.org/Limine/Limine/src/branch/trunk/CONFIG.md)
timeout: 0
serial: yes

/Nekotia
    protocol: limine
    path: boot():/boot/nekotia.elf
    cmdline: loglevel=info
    # ustar archive unpacked into the VFS at boot: /bin (user programs), /etc, /home (see Makefile, initrd/)
    module_path: boot():/boot/initrd.tar
