# Limine configuration (https://codeberg.org/Limine/Limine/src/branch/trunk/CONFIG.md)
timeout: 0
serial: yes

/Nekotia
    protocol: limine
    path: boot():/boot/nekotia.elf
    cmdline: loglevel=info
    # module_path lines for the user programs (/boot/bin/*) are appended by the Makefile (build/limine.conf)
